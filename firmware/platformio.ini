; PlatformIO 工程配置 —— ESP32-S3 (N16R8: 16MB Flash + 8MB OPI PSRAM)
; 用法：  pio run -t upload       然后  pio device monitor

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ---- N16R8 关键参数：必须匹配，否则 PSRAM 用不了或直接跑不起来 ----
board_build.flash_size          = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB

; ---- 使用芯片原生 USB 串口（日志从 USB 口出）----
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0

; 只编译灯效程序（src/diag.cpp 是诊断程序，只在 [env:diag] 里编译）
build_src_filter = +<main.cpp>

monitor_speed = 115200
upload_speed  = 921600

; 本程序自己直接驱动灯带（不依赖任何第三方灯带库），所以这里不装 FastLED：
; 那个库要编译 300 多个文件，白白拖慢每次编译。
; lib_deps =
;     fastled/FastLED@^3.9.0
;     adafruit/Adafruit NeoPixel@^1.12.0

; 想用 Arduino core 3.x（更新更快）时，把上面的 platform 换成社区分支：
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip

; =====================================================================
; 诊断固件：排查"灯带不亮"用。烧录方式见同目录的「诊断灯带.command」
; =====================================================================
[env:diag]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size          = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB

build_src_filter = +<diag.cpp>

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200
